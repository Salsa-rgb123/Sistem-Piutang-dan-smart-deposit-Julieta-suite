name: Deploy Julieta Suite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
       with:
        enablement: true
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
